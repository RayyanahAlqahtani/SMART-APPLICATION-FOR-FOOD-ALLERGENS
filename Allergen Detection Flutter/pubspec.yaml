name: allergen_detection_flutter
description: "A Smart Food Allergen Detection App (UI Demo)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.5

  # UI & Design
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  dotted_border: ^2.0.0
  fl_chart: ^0.65.0
  animations: ^2.0.11

  # Utilities
  intl: ^0.18.1
  image_picker: ^1.0.4
  uuid: ^4.2.1
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
